
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Sereno Verde</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Full-screen background */
    .login-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;

      background-image:
        linear-gradient(
          rgba(69, 47, 37, 0.48),
          rgba(69, 47, 37, 0.48)
        ),
        url("https://a0.muscache.com/im/pictures/hosting/Hosting-1491758183598216742/original/c7c99381-da37-4a8e-99cb-63f89046bc1d.jpeg?im_w=1920");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Login panel */
    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 42px 38px;
      background: rgba(228, 216, 212, 0.96);
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    /* Temporary text-based logo */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-mark {
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #80604d;
      border-radius: 50%;
      color: #80604d;
      font-family: Georgia, serif;
      font-size: 32px;
    }

    .brand h1 {
      color: #604838;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .brand p {
      margin-top: 8px;
      color: #78675f;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .login-heading {
      margin-bottom: 25px;
      text-align: center;
      color: #554034;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: normal;
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #5c493f;
      font-size: 13px;
      font-weight: 600;
    }

    .form-group input {
      display: block;
      width: 100%;
      height: 47px;
      padding: 0 14px;
      border: 1px solid #c8b8b0;
      border-radius: 4px;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      color: #3e332d;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #80604d;
      box-shadow: 0 0 0 3px rgba(128, 96, 77, 0.12);
    }

    .login-button {
      width: 100%;
      min-height: 48px;
      margin-top: 7px;
      border: none;
      border-radius: 4px;
      background: #80604d;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-button:hover {
      background: #654936;
    }

    .login-button:focus-visible {
      outline: 3px solid #a98a75;
      outline-offset: 3px;
    }

    .error-message {
      display: none;
      margin: 0 0 14px;
      color: #8b2929;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .footer-text {
      margin-top: 24px;
      color: #78675f;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    /* Smaller screens */
    @media (max-width: 480px) {
      .login-page {
        padding: 18px;
      }

      .login-card {
        padding: 32px 24px;
      }

      .brand h1 {
        font-size: 22px;
      }
    }

    @media (max-height: 600px) {
      .login-page {
        align-items: flex-start;
      }

      .login-card {
        margin-top: 10px;
        margin-bottom: 10px;
        padding-top: 25px;
        padding-bottom: 25px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand">
        <div class="brand-mark">S</div>
        <h1>SERENO VERDE</h1>
        <p>ADMINISTRATION</p>
      </div>

      <h2 class="login-heading">Admin Login</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Username</label>
          <input
            type="text"
            id="email"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <p
          id="errorMessage"
          class="error-message"
          role="alert"
          aria-live="polite"
        ></p>

        <button type="submit" class="login-button">
          Log in
        </button>
      </form>

      <p class="footer-text">
        Sereno Verde Escape<br />
        Authorized personnel only
      </p>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      errorMessage.style.display = "none";
      errorMessage.textContent = "";

      if (
        username.toLowerCase() === "admin" &&
        password === "12345678"
      ) {
        window.location.href = "admin.html";
      } else {
        errorMessage.textContent =
          "Incorrect username or password. Please try again.";
        errorMessage.style.display = "block";
      }
    });
  </script>
</body>
</html>
