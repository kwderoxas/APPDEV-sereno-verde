
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Stay | Sereno Verde</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --available: #75ce70;
    --daycation: #e0b814;
    --nightcation: #2994a7;
    --booked: #d1373a;
    --blocked: #858080;
    --brown: #985b36;
    --panel: #f2e9e8;
    --border: #c69b82;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #202020;
    color: #171717;
    min-height: 100vh;
    padding: 0;
    margin: 0;
}

.page-background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        url("https://a0.muscache.com/im/pictures/hosting/Hosting-1491758183598216742/original/c7c99381-da37-4a8e-99cb-63f89046bc1d.jpeg?im_w=1920")
        center center / cover no-repeat;
}

.page-background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(20, 20, 20, 0.30);
}

.back-link {
    position: absolute;
    top: 37px;
    left: 34px;
    z-index: 5;
    color: white;
    font-size: 12px;
    text-decoration: none;
    text-shadow: 0 1px 5px #333;
}

.back-link:hover {
    text-decoration: underline;
}

.booking-layout {
    width: calc(100% - 64px);
    max-width: none;
    margin: 66px auto 24px;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 24px;
    align-items: stretch;
}

/* CALENDAR */

.calendar-panel,
.form-panel {
    background: var(--panel);
    border: 1px solid #c6b4b0;
    border-radius: 5px;
    overflow: hidden;
    min-width: 0;
}

.calendar-heading {
    display: grid;
    grid-template-columns: 42px 1fr 42px;
    align-items: center;
    text-align: center;
    min-height: 38px;
    padding: 0 12px;
}

.month-title {
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.2px;
}

.month-button {
    background: transparent;
    border: none;
    color: #111;
    cursor: pointer;
    font-size: 29px;
    line-height: 1;
    font-weight: 300;
    padding: 2px;
}

.month-button:hover {
    color: var(--brown);
}

.legend {
    min-height: 39px;
    border-top: 1px solid #b9aaa7;
    border-bottom: 1px solid #b9aaa7;
    padding: 7px 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 8px;
    color: #ad8876;
    white-space: nowrap;
}

.legend-color {
    width: 21px;
    height: 21px;
    border-radius: 6px;
    flex-shrink: 0;
}

.available-color { background: var(--available); }
.daycation-color { background: var(--daycation); }
.nightcation-color { background: var(--nightcation); }
.booked-color { background: var(--booked); }
.blocked-color { background: var(--blocked); }

.calendar-content {
    padding: 14px 20px 18px;
}

.weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 5px;
}

.weekdays {
    margin-bottom: 8px;
}

.weekdays span {
    text-align: center;
    color: #b58e7d;
    font-size: 9px;
    padding: 2px 0;
}

.calendar-day,
.empty-day {
    aspect-ratio: 1 / 1;
    min-width: 0;
}

.calendar-day {
    border: 0;
    border-radius: 6px;
    color: #080808;
    font-size: clamp(13px, 1.8vw, 20px);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}

.calendar-day:hover:not(:disabled) {
    transform: scale(1.04);
    box-shadow: 0 0 0 2px rgba(64, 64, 64, 0.35);
}

.calendar-day.available { background: var(--available); }
.calendar-day.daycation { background: var(--daycation); }
.calendar-day.nightcation { background: var(--nightcation); }

.calendar-day.booked {
    background: var(--booked);
    color: #111;
    cursor: not-allowed;
}

.calendar-day.blocked {
    background: var(--blocked);
    color: white;
    cursor: not-allowed;
}

.calendar-day:disabled {
    opacity: 1;
}

.calendar-day.selected {
    outline: 3px solid #278bd0;
    outline-offset: -3px;
    box-shadow: 0 0 0 2px white;
}

.calendar-day.today {
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4);
}

.calendar-message {
    min-height: 35px;
    padding-top: 12px;
    color: #73513f;
    font-size: 11px;
    line-height: 1.5;
}

/* BOOKING FORM */

.form-panel {
    padding: 9px 15px 15px;
}

.form-heading {
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 10px;
}

.booking-options {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
}

.booking-option {
    min-height: 76px;
    background: #f6eeec;
    border: 1px solid #c69b82;
    border-radius: 7px;
    cursor: pointer;
    color: #222;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    padding: 7px 4px;
}

.booking-option:hover {
    background: white;
}

.booking-option.active {
    border: 2px solid #168ee5;
    box-shadow: 0 0 0 1px rgba(22,142,229,0.15);
}

.option-icon {
    font-size: 23px;
    line-height: 25px;
}

.option-name {
    font-size: 12px;
}

.option-time {
    color: #a27b68;
    font-size: 10px;
}


.booking-summary {
    background: #e8dcda;
    border-radius: 4px;
    padding: 8px;
    font-size: 10px;
    line-height: 1.6;
    margin-bottom: 10px;
    display: none;
}

.booking-summary.visible {
    display: block;
}

.booking-summary strong {
    color: #74462e;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 14px;
    row-gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.field.full-width {
    grid-column: 1 / -1;
}

.field label {
    font-size: 12px;
    margin: 0 0 5px 2px;
    color: #292421;
}

.field input,
.field select,
.field textarea {
    width: 100%;
    min-width: 0;
    min-height: 35px;
    border: 1px solid #c69b82;
    border-radius: 6px;
    background: #f5eeec;
    padding: 7px 9px;
    color: #222;
    font: 13px Arial, sans-serif;
    outline: none;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
    border-color: #278bd0;
    box-shadow: 0 0 0 1px rgba(39,139,208,0.15);
}

.field select {
    height: 35px;
}

.field textarea {
    height: 65px;
    resize: vertical;
}


.submit-button {
    width: 100%;
    min-height: 38px;
    border: none;
    border-radius: 2px;
    background: #985b36;
    color: white;
    font-size: 13px;
    cursor: pointer;
    margin-top: 18px;
}

.submit-button:hover {
    background: #754329;
}

.submit-button:disabled {
    opacity: 0.65;
    cursor: wait;
}

.status-message {
    display: none;
    margin-top: 10px;
    padding: 9px;
    border-radius: 4px;
    font-size: 11px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.status-message.visible {
    display: block;
}

.status-message.success {
    background: #d9efd5;
    color: #245b20;
}

.status-message.error {
    background: #f6d8d6;
    color: #842a27;
}

@media (min-width: 1200px) {
    .booking-layout {
        margin-top: 54px;
    }
}

@media (max-width: 760px) {
    body {
        padding: 0;
    }

    .booking-layout {
        width: calc(100% - 24px);
        margin-top: 48px;
    }

    .back-link {
        top: 19px;
        left: 20px;
    }

    .booking-layout {
        grid-template-columns: 1fr;
        width: min(500px, 100%);
        margin-top: 48px;
        gap: 15px;
    }

    .calendar-content {
        padding: 14px 16px;
    }

    .calendar-day {
        font-size: 18px;
    }

    .legend-item {
        font-size: 9px;
    }

    .form-panel {
        padding: 13px 15px 16px;
    }

    .field input {
        height: 30px;
        font-size: 13px;
    }

    .field label {
        font-size: 11px;
    }

    .option-name {
        font-size: 11px;
    }

    .option-time {
        font-size: 9px;
    }

    .submit-button {
        min-height: 38px;
        font-size: 12px;
    }
}

@media (max-width: 380px) {
    .legend {
        justify-content: flex-start;
    }

    .legend-item {
        width: 30%;
    }

    .calendar-content {
        padding: 12px 9px;
    }

    .weekdays,
    .calendar-grid {
        gap: 4px;
    }

    .calendar-day {
        font-size: 15px;
    }

    .form-grid {
        column-gap: 9px;
    }

    .booking-options {
        gap: 5px;
    }
}
</style>
</head>

<body>

<div class="page-background"></div>

<a class="back-link" href="index.html">‹ &nbsp; Back</a>

<main class="booking-layout">

    <!-- LEFT SIDE: CALENDAR -->
    <section class="calendar-panel" aria-label="Booking calendar">

        <div class="calendar-heading">
            <button
                class="month-button"
                id="previousMonth"
                type="button"
                aria-label="Previous month"
            >‹</button>

            <h1 class="month-title" id="monthTitle">October 2026</h1>

            <button
                class="month-button"
                id="nextMonth"
                type="button"
                aria-label="Next month"
            >›</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="legend-color available-color"></span>
                Available
            </div>
            <div class="legend-item">
                <span class="legend-color daycation-color"></span>
                Daycation
            </div>
            <div class="legend-item">
                <span class="legend-color nightcation-color"></span>
                Nightcation
            </div>
            <div class="legend-item">
                <span class="legend-color booked-color"></span>
                Fully Booked
            </div>
            <div class="legend-item">
                <span class="legend-color blocked-color"></span>
                Blocked
            </div>
        </div>

        <div class="calendar-content">

            <div class="weekdays">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>

            <div class="calendar-message" id="calendarMessage" aria-live="polite">
                Select a green date to start your booking.
            </div>

        </div>
    </section>

    <!-- RIGHT SIDE: GUEST BOOKING FORM -->
    <section class="form-panel" aria-label="Booking details">

        <h2 class="form-heading">Booking</h2>

        <div class="booking-options">

            <button
                type="button"
                class="booking-option"
                data-type="daycation"
                aria-pressed="false"
            >
                <span class="option-icon">☼</span>
                <span class="option-name">Daycation</span>
                <span class="option-time">8:00 AM - 6:00 PM</span>
            </button>

            <button
                type="button"
                class="booking-option"
                data-type="nightcation"
                aria-pressed="false"
            >
                <span class="option-icon">☾</span>
                <span class="option-name">Nightcation</span>
                <span class="option-time">8:00 PM - 6:00 AM</span>
            </button>

            <button
                type="button"
                class="booking-option active"
                data-type="22hours"
                aria-pressed="true"
            >
                <span class="option-icon">◷</span>
                <span class="option-name">22 Hours stay</span>
                <span class="option-time">8:00 AM - 6:00 AM</span>
            </button>

        </div>

        <div class="booking-summary" id="bookingSummary">
            <strong>Selected booking:</strong>
            <span id="summaryText">22 Hours stay</span>
        </div>

        <form id="bookingForm">

            <div class="form-grid">

                <div class="field">
                    <label for="fullName">Full name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="fbName">Fb Name</label>
                    <input
                        type="text"
                        id="fbName"
                        name="fbName"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="phone">Phone number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="field">
                    <label for="region">Region</label>
                    <input
                        type="text"
                        id="region"
                        name="region"
                        autocomplete="address-level1"
                        required
                    >
                </div>

                <div class="field">
                    <label for="province">Province</label>
                    <input
                        type="text"
                        id="province"
                        name="province"
                        autocomplete="address-level1"
                        required
                    >
                </div>

                <div class="field full-width">
                    <label for="city">City/Municipality</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        autocomplete="address-level2"
                        required
                    >
                </div>

                <div class="field">
                    <label for="eventType">Event type</label>
                    <select id="eventType" name="eventType" required>
                        <option value="" selected disabled>Select event</option>
                        <option value="Staycation">Staycation</option>
                        <option value="Birthday">Birthday</option>
                        <option value="Family Gathering">Family Gathering</option>
                        <option value="Anniversary">Anniversary</option>
                        <option value="Wedding">Wedding</option>
                        <option value="Team Building">Team Building</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="guests">Number of Guests</label>
                    <input
                        type="number"
                        id="guests"
                        name="guests"
                        min="1"
                        max="100"
                        value="2"
                        required
                    >
                </div>

                <div class="field full-width">
                    <label for="accommodation">Villa / Accommodation</label>
                    <select id="accommodation" name="accommodation" required>
                        <option value="" selected disabled>Select accommodation</option>
                        <option value="Tuscan Villa">Tuscan Villa</option>
                        <option value="Spanish Villa">Spanish Villa</option>
                        <option value="Other">Other / To be confirmed</option>
                    </select>
                </div>

                <div class="field full-width">
                    <label for="specialRequests">Special requests (optional)</label>
                    <textarea
                        id="specialRequests"
                        name="specialRequests"
                        placeholder="Add any special requests here..."
                    ></textarea>
                </div>

            </div>

            <button class="submit-button" id="submitButton" type="submit">
                Book
            </button>

            <div
                class="status-message"
                id="statusMessage"
                role="status"
                aria-live="polite"
            ></div>

        </form>

    </section>
</main>

<script>
/*
    BOOKING PAGE

    API endpoint:
    GET  /api/bookings
    POST /api/bookings

    This page expects the backend to return booking dates and
    accommodation information for calendar availability.
*/

const API_URL = "/api/bookings";

const calendarGrid = document.getElementById("calendarGrid");
const monthTitle = document.getElementById("monthTitle");
const calendarMessage = document.getElementById("calendarMessage");

const bookingForm = document.getElementById("bookingForm");
const submitButton = document.getElementById("submitButton");
const statusMessage = document.getElementById("statusMessage");

const bookingSummary = document.getElementById("bookingSummary");
const summaryText = document.getElementById("summaryText");

let currentDate = new Date(2026, 9, 1);
let selectedDate = null;
let selectedBookingType = "22hours";

let bookings = [];
let unavailableDates = new Map();

const bookingTypeDetails = {
    daycation: {
        label: "Daycation",
        time: "8:00 AM - 6:00 PM"
    },
    nightcation: {
        label: "Nightcation",
        time: "8:00 PM - 6:00 AM"
    },
    "22hours": {
        label: "22 Hours stay",
        time: "8:00 AM - 6:00 AM"
    }
};

/*
    These example colors match the supplied reference screenshot.
    They are visual examples, not confirmed availability from the
    server. Once the API loads, actual bookings take priority.
*/
const sampleCalendarStatuses = {
    "2026-10-17": "daycation",
    "2026-10-18": "nightcation",
    "2026-10-19": "daycation"
};

function formatDateKey(year, month, day) {
    return [
        year,
        String(month + 1).padStart(2, "0"),
        String(day).padStart(2, "0")
    ].join("-");
}

function formatReadableDate(dateString) {
    if (!dateString) return "No date selected";

    const parts = dateString.split("-").map(Number);
    const date = new Date(parts[0], parts[1] - 1, parts[2]);

    return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });
}

function showStatus(message, type) {
    statusMessage.textContent = message;
    statusMessage.className = "status-message visible " + type;
}

function clearStatus() {
    statusMessage.textContent = "";
    statusMessage.className = "status-message";
}

function normalizeBookingDate(booking) {
    const possibleValues = [
        booking.booking_date,
        booking.bookingDate,
        booking.date,
        booking.check_in,
        booking.checkIn,
        booking.selected_date
    ];

    for (const value of possibleValues) {
        if (!value) continue;

        const match = String(value).match(/^(\d{4}-\d{2}-\d{2})/);

        if (match) {
            return match[1];
        }
    }

    return null;
}

function normalizeAccommodation(booking) {
    return String(
        booking.accommodation ||
        booking.room ||
        booking.unit ||
        booking.villa ||
        ""
    ).trim().toLowerCase();
}

function isSameAccommodation(booking) {
    const existing = normalizeAccommodation(booking);
    const selected = document.getElementById("accommodation").value
        .trim()
        .toLowerCase();

    // If an older booking record has no accommodation field,
    // treat it as unavailable for all accommodations on that date.
    if (!existing || !selected) return true;

    return existing === selected;
}

function getStatusForDate(dateKey) {
    const dateBookings = bookings.filter(booking => {
        const date = normalizeBookingDate(booking);

        const status = String(
            booking.status || booking.booking_status || "confirmed"
        ).toLowerCase();

        const cancelled = [
            "cancelled",
            "canceled",
            "rejected",
            "declined"
        ].includes(status);

        return date === dateKey && !cancelled;
    });

    if (dateBookings.length > 0) {
        const matchingAccommodation = dateBookings.filter(isSameAccommodation);

        if (matchingAccommodation.length > 0) {
            return "booked";
        }
    }

    if (unavailableDates.has(dateKey)) {
        return unavailableDates.get(dateKey);
    }

    return sampleCalendarStatuses[dateKey] || "available";
}

function isDateInPast(dateKey) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const parts = dateKey.split("-").map(Number);
    const date = new Date(parts[0], parts[1] - 1, parts[2]);

    return date < today;
}

function renderCalendar() {
    calendarGrid.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthTitle.textContent = currentDate.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric"
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "empty-day";
        empty.setAttribute("aria-hidden", "true");
        calendarGrid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = formatDateKey(year, month, day);
        const status = getStatusForDate(dateKey);
        const button = document.createElement("button");

        button.type = "button";
        button.textContent = day;
        button.className = "calendar-day " + status;
        button.setAttribute(
            "aria-label",
            formatReadableDate(dateKey) + ", " + status
        );

        if (selectedDate === dateKey) {
            button.classList.add("selected");
            button.setAttribute("aria-pressed", "true");
        } else {
            button.setAttribute("aria-pressed", "false");
        }

        if (isDateInPast(dateKey)) {
            button.disabled = true;
            button.classList.add("blocked");
            button.classList.remove("available", "daycation", "nightcation");
            button.title = "Past dates cannot be selected";
        } else if (status === "booked" || status === "blocked") {
            button.disabled = true;
            button.title = status === "booked"
                ? "This date is already booked for this accommodation"
                : "This date is blocked";
        } else {
            button.addEventListener("click", () => selectDate(dateKey));
            button.title = "Select " + formatReadableDate(dateKey);
        }

        calendarGrid.appendChild(button);
    }
}

function selectDate(dateKey) {
    const status = getStatusForDate(dateKey);

    if (status === "booked" || status === "blocked" || isDateInPast(dateKey)) {
        calendarMessage.textContent =
            "This date is unavailable. Please choose another date.";
        return;
    }

    selectedDate = dateKey;

    calendarMessage.textContent =
        "Selected date: " + formatReadableDate(dateKey);

    clearStatus();
    renderCalendar();
    updateBookingSummary();
}

function updateBookingSummary() {
    if (!selectedDate) {
        bookingSummary.classList.remove("visible");
        return;
    }

    const details = bookingTypeDetails[selectedBookingType];

    summaryText.textContent =
        formatReadableDate(selectedDate) +
        " • " +
        details.label +
        " (" + details.time + ")";

    bookingSummary.classList.add("visible");
}

document.querySelectorAll(".booking-option").forEach(option => {
    option.addEventListener("click", () => {
        selectedBookingType = option.dataset.type;

        document.querySelectorAll(".booking-option").forEach(item => {
            const isActive = item === option;
            item.classList.toggle("active", isActive);
            item.setAttribute("aria-pressed", String(isActive));
        });

        updateBookingSummary();
        clearStatus();
    });
});

document.getElementById("previousMonth").addEventListener("click", () => {
    currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() - 1,
        1
    );
    renderCalendar();
});

document.getElementById("nextMonth").addEventListener("click", () => {
    currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() + 1,
        1
    );
    renderCalendar();
});

document.getElementById("accommodation").addEventListener("change", () => {
    renderCalendar();
    clearStatus();
});

/*
    Load existing bookings from the backend.
    The page remains usable if the server is temporarily unavailable.
*/
async function loadBookings() {
    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Could not retrieve bookings.");
        }

        const data = await response.json();

        bookings = Array.isArray(data)
            ? data
            : Array.isArray(data.bookings)
                ? data.bookings
                : [];

        renderCalendar();
    } catch (error) {
        console.warn("Booking availability could not be loaded:", error);
        renderCalendar();
    }
}

/*
    Submit the reservation to the existing API.
    The backend must accept the field names sent below.
*/
bookingForm.addEventListener("submit", async event => {
    event.preventDefault();
    clearStatus();

    if (!selectedDate) {
        showStatus("Please select an available date on the calendar.", "error");
        return;
    }

    if (isDateInPast(selectedDate)) {
        showStatus("Please select a future date.", "error");
        return;
    }

    const accommodation =
        document.getElementById("accommodation").value;

    if (!accommodation) {
        showStatus("Please select a villa or accommodation.", "error");
        return;
    }

    const status = getStatusForDate(selectedDate);

    if (status === "booked" || status === "blocked") {
        showStatus(
            "This date is no longer available. Please select another date.",
            "error"
        );
        renderCalendar();
        return;
    }

    const formData = new FormData(bookingForm);
    const details = bookingTypeDetails[selectedBookingType];

    const payload = {
        booking_date: selectedDate,
        bookingDate: selectedDate,
        date: selectedDate,
        booking_type: selectedBookingType,
        bookingType: selectedBookingType,
        accommodation: accommodation,
        room: accommodation,
        fullName: formData.get("fullName"),
        fbName: formData.get("fbName"),
        email: formData.get("email"),
        phone: formData.get("phone"),
        region: formData.get("region"),
        province: formData.get("province"),
        city: formData.get("city"),
        eventType: formData.get("eventType"),
        guests: Number(formData.get("guests")),
        specialRequests: formData.get("specialRequests"),
        status: "pending"
    };

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                result.message ||
                result.error ||
                "The booking could not be submitted. Please try again."
            );
        }

        const bookingId =
            result.bookingId ??
            result.booking_id ??
            result.id ??
            result.insertId;

        showStatus(
            "Your booking request was submitted successfully." +
            (bookingId ? " Booking ID: " + bookingId + "." : "") +
            " Please wait for confirmation.",
            "success"
        );

        /*
            Reload records to update the calendar using the server.
            Pending bookings should only block dates if your backend
            considers them reserved.
        */
        await loadBookings();

        bookingForm.reset();
        selectedDate = null;
        selectedBookingType = "22hours";

        document.querySelectorAll(".booking-option").forEach(option => {
            const active = option.dataset.type === "22hours";
            option.classList.toggle("active", active);
            option.setAttribute("aria-pressed", String(active));
        });

        calendarMessage.textContent =
            "Select a date for another booking.";

        renderCalendar();
        updateBookingSummary();

    } catch (error) {
        showStatus(
            error.message ||
            "Unable to connect to the booking server. Please try again.",
            "error"
        );
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Book";
    }
});

// Initial page setup
renderCalendar();
loadBookings();
</script>
